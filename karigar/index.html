<style>
:root{

}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45}
button,input{font:inherit}

.tabs{display:flex;background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:64px;z-index:4;overflow-x:auto}
.tabs button{flex:1;border:0;background:none;padding:12px 8px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--sign-gold)}

main{padding:14px 0 90px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}

.top{display:flex;justify-content:space-between;align-items:center;gap:8px}

.items{margin:6px 0 10px;padding-left:18px;font-size:15px}

.btn.gold{background:var(--sign-gold);border-color:var(--sign-gold);color:#0B1626}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.wa{background:var(--wa);border-color:var(--wa);color:#fff}
.btn.line{background:transparent}
.btn.sm{min-height:38px;padding:0 12px;font-size:14px}
.btn[disabled]{opacity:.55}
.grow{flex:1}
.muted{color:var(--muted)}.small{font-size:13px}
.msg{min-height:20px;margin:6px 0 0;font-weight:600}.msg.err{color:var(--bad)}.msg.ok{color:var(--ok)}
.login{max-width:440px;margin:40px auto;padding:0 16px}

.empty{text-align:center;color:var(--muted);padding:40px 10px}
.empty b{display:block;font-size:40px}

</style>

<style>

.due{font-weight:700}.due.late{color:var(--bad)}
.note{background:var(--gold-soft);border-radius:8px;padding:8px 10px;margin-top:8px;font-size:15px}
textarea{width:100%;min-height:60px;border-radius:10px;border:1px solid var(--line);padding:8px;background:var(--bg);color:var(--ink);font:inherit;margin-top:8px}
</style>

    var g = el('div',{'class':'g'},[ el('b',{text:(i+1)+'. '+it.type+(it.qty>1?' × '+it.qty:'')+(it.forWho?' · '+it.forWho:'')}) ]);
    var st = Object.keys(it.style||{}).map(function(k){ return it.style[k]; }).filter(Boolean).join(' · ');
    if (it.fabric) g.appendChild(el('div',{'class':'small',text:L('कपड़ा: ','Cloth: ')+it.fabric}));
    if (st) g.appendChild(el('div',{'class':'small',text:L('डिज़ाइन: ','Design: ')+st}));
    if (it.notes) g.appendChild(el('div',{'class':'small',text:L('नोट: ','Note: ')+it.notes}));
    var m = it.meas || {}, mk = Object.keys(m);
    if (mk.length){ g.appendChild(el('div',{'class':'small',style:'font-weight:700;margin-top:6px',text:L('नाप (इंच)','Measurements (inch)')})); g.appendChild(el('div',{'class':'meas'}, mk.map(function(k){ return el('div',null,[ el('span',{text:k}), el('b',{text:m[k]+'"'}) ]); }))); }
    else if (it.measAt !== 'given') g.appendChild(el('div',{'class':'small muted',text:L('नाप दुकान पर मिलेगा','Measurements at the shop')}));
    if (it.photo) g.appendChild(el('a',{href:it.photo,target:'_blank'},[ el('img',{src:it.photo,alt:''}) ]));
    c.appendChild(g);
  });
  var m = el('p',{'class':'msg'});
  var nt = el('textarea',{placeholder:L('दुकान के लिए कुछ लिखना है? (जैसे कपड़ा कम है)','Message for the shop (e.g. cloth is short)')}); nt.value = j.knote || '';
  var upd = function(st){ m.textContent = '…'; m.className = 'msg';
    db.collection('karigars').doc(tok).collection('jobs').doc(j._id).update({kstatus:st, kAt:new Date().toISOString(), knote:nt.value.trim()}).then(function(){ m.textContent = '✓'; m.className = 'msg ok'; }, function(e){ m.textContent = L('नहीं हुआ: ','Failed: ')+(e.code||e.message); m.className = 'msg err'; }); };
  if (j.kstatus !== 'done' && ['ready','delivered','cancelled'].indexOf(j.tstatus) < 0){
    c.appendChild(nt);
    c.appendChild(el('div',{'class':'row',style:'margin-top:8px'},[
      j.kstatus !== 'started' ? el('button',{'class':'btn gold grow',type:'button',text:'🧵 '+L('काम शुरू किया','Started'),onclick:function(){ upd('started'); }}) : null,
      el('button',{'class':'btn ok grow',type:'button',text:'✓ '+L('काम पूरा हो गया','Work finished'),onclick:function(){ if (confirm(L('यह काम पूरा हो गया?','Is this work finished?'))) upd('done'); }}) ]));
  } else if (j.kstatus === 'done') c.appendChild(el('div',{'class':'small muted',style:'margin-top:8px',text:'✓ '+L('पूरा किया: ','Finished: ')+when(j.kAt)}));
  c.appendChild(m);
  return c;
}
if (!tok){ screen('🔗', L('लिंक अधूरा है','Link is incomplete'), L('दुकान से भेजा गया पूरा लिंक खोलें।','Open the full link the shop sent you.')); return; }
db.collection('karigars').doc(tok).onSnapshot(function(s){
  if (!s.exists){ screen('🚫', L('यह लिंक बंद है','This link is closed'), L('दुकान मालिक से नया लिंक माँगें।','Ask the shop owner for a new link.')); return; }
  var first = !me; me = s.data();
  if (first){
    db.collection('karigars').doc(tok).collection('deductions').onSnapshot(function(q){ deds = []; q.forEach(function(d){ var x = d.data(); x._id = d.id; deds.push(x); }); if (jobs) draw(); }, function(){});
    db.collection('karigars').doc(tok).collection('jobs').onSnapshot(function(q){
      jobs = []; q.forEach(function(d){ var x = d.data(); x._id = d.id; jobs.push(x); });
      var fresh = seen ? jobs.filter(function(j){ return !seen[j._id]; }) : [];
      if (!seen) seen = {}; jobs.forEach(function(j){ seen[j._id] = 1; });
      fresh.forEach(function(j){ notify('🧵 '+L('नया सिलाई काम','New tailoring work'), (j.bookingId||'')+' · '+(j.items||[]).map(function(i){ return i.type; }).join(', ')+(j.due?' · '+dmy(j.due):'')); });
      draw();
    }, function(){ screen('🚫', L('यह लिंक बंद है','This link is closed'), L('दुकान मालिक से बात करें।','Talk to the shop owner.')); });
  } else draw();
}, function(){ screen('🚫', L('यह लिंक बंद है','This link is closed'), L('दुकान मालिक से नया लिंक माँगें।','Ask the shop owner for a new link.')); });
})();
</script>
</body>
