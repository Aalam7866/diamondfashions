<style>

    if (!it.grp){ gsel = el('select',{style:'min-height:44px;border-radius:10px;border:1px solid var(--line);padding:4px 8px;margin-top:6px;background:var(--surface);color:var(--ink);font:inherit'},[ el('option',{value:'',text:L('उम्र / ग्रुप चुनें','Choose age / group')}) ].concat(RGRP.map(function(r){ return el('option',{value:r[0],text:(LANG==='en'?r[2]:r[1])+(myRate(it.k, r[0])?' · '+rs(myRate(it.k, r[0])):'')}); })));
      gsel.value = grp; gsel.onchange = function(){ grp = pickG[i] = gsel.value; upd(); }; g.appendChild(gsel); }
    var cnt = el('b',{'class':'num',style:'font-size:22px;min-width:40px;text-align:center',text:String(pcs)}), line = el('div',{'class':'small',style:'font-weight:600'});
    function upd(){ cnt.textContent = String(pcs); var r = myRate(it.k, grp); line.textContent = grp ? (r ? rs(r)+' × '+pcs+' = '+rs(r*pcs) : L('रेट अभी तय नहीं — दुकान तय करेगी','Rate not set yet — the shop will set it')) : ''; }
    g.appendChild(el('div',{'class':'row',style:'margin-top:8px'},[ el('span',{text:L('मेरे पीस:','My pieces:')}),
      el('button',{'class':'btn sm line',type:'button',text:'−',onclick:function(){ if (pcs > 1){ pcs--; upd(); } }}), cnt, el('button',{'class':'btn sm line',type:'button',text:'+',onclick:function(){ if (pcs < 500){ pcs++; upd(); } }}) ]));
    g.appendChild(line);
    var msg = el('p',{'class':'msg'+(addMsg[i]?' ok':''),text:addMsg[i]||''});
    g.appendChild(el('button',{'class':'btn ok',type:'button',style:'width:100%;margin-top:8px',text:'✓ '+L('मेरे काम में जोड़ें','Add to my work'),onclick:function(e){
      if (!grp){ msg.textContent = L('पहले उम्र / ग्रुप चुनें','Choose the age / group first'); msg.className = 'msg err'; return; }
      if (already && !confirm(L('आप इस कपड़े के '+already+' पीस पहले जोड़ चुके हैं। फिर से जोड़ें?','You already added '+already+' pcs of this. Add again?'))) return;
      var rate = myRate(it.k, grp); e.target.disabled = true; msg.textContent = '…'; msg.className = 'msg';
      db.collection('karigars').doc(tok).collection('work').add({bid:found.bid, k:it.k||'other', type:it.type||'', grp:grp, pcs:pcs, rate:rate, amt:rate*pcs, ts:firebase.firestore.FieldValue.serverTimestamp(), day:today(), idx:i})
        .then(function(){ chime(); addMsg[i] = '✓ '+pcs+' '+L('पीस जुड़ गए','pcs added')+(rate?' · '+rs(rate*pcs):''); draw(); },
          function(er){ e.target.disabled = false; msg.textContent = L('नहीं जुड़ा: ','Not added: ')+(er.code||er.message); msg.className = 'msg err'; });
    }}));
    g.appendChild(msg); upd();
    c.appendChild(g);
  });
  main.appendChild(c);
}
function drawWork(main){
  filterBar(main);
  var list = work.filter(function(w){ return inPeriod(w.day); }).sort(function(a,b){ return String(b.day||'').localeCompare(String(a.day||'')) || ((b.ts&&b.ts.seconds)||0)-((a.ts&&a.ts.seconds)||0); });
  var earn = list.reduce(function(a,w){ return a+(+w.amt||0); },0), pcs = list.reduce(function(a,w){ return a+(+w.pcs||0); },0);
  var dd = deds.filter(function(d){ return inPeriod(d.date); }), dsum = dd.reduce(function(a,d){ return a+(+d.amount||0); },0);
  main.appendChild(el('div',{'class':'tot'},[ el('span',{text:periodLabel()+' · '+pcs+' '+L('पीस','pcs')}), el('b',{text:rs(earn)}) ]));
  if (dsum) main.appendChild(el('div',{'class':'tot bad',onclick:function(){ tab = 'ded'; draw(); }},[ el('span',{text:'⚠ '+L('कटौती','Deductions')+' ('+dd.length+')'}), el('b',{text:'−'+rs(dsum)}) ]));
  main.appendChild(el('div',{'class':'tot',style:'background:rgba(28,122,62,.12);color:var(--ok)'},[ el('span',{text:L('मिलेगा','To receive')}), el('b',{style:'font-size:20px',text:rs(Math.max(0, earn-dsum))}) ]));
  if (!list.length){ main.appendChild(el('div',{'class':'empty'},[ el('b',{text:'🧵'}), L('इस समय में कोई काम नहीं जोड़ा। “काम जोड़ें” में ऑर्डर नंबर डालें।','No work added in this period. Use “Add work”.') ])); return; }
  list.forEach(function(w){
    var fresh = w.ts && w.ts.toMillis && (Date.now() - w.ts.toMillis() < 23*3600*1000);
    main.appendChild(el('div',{'class':'job'},[ el('div',{'class':'top'},[ el('span',{'class':'num',text:w.bid}), el('b',{style:'font-size:18px',text:rs(w.amt)}) ]),
      el('div',{style:'margin-top:4px',text:tName(w.k, w.type)+(w.grp?' · '+gName(w.grp):'')+' · '+w.pcs+' '+L('पीस','pcs')+(w.rate?' × '+rs(w.rate):' · '+L('रेट बाकी','rate pending'))}),
      el('div',{'class':'row',style:'justify-content:space-between;margin-top:4px'},[ el('span',{'class':'small muted',text:dmy(w.day)}),
        fresh ? el('button',{'class':'btn sm line',type:'button',style:'color:var(--bad)',text:'✕ '+L('गलती से जोड़ा — हटाएँ','Added by mistake — remove'),onclick:function(){ if (confirm(L('यह एंट्री हटाएँ?','Remove this entry?'))) db.collection('karigars').doc(tok).collection('work').doc(w._id).delete().catch(function(e){ alert(e.message); }); }}) : null ]) ]));
  });
}
function drawDed(main){
  filterBar(main);
  var list = deds.filter(function(d){ return inPeriod(d.date); }).sort(function(a,b){ return String(b.date||'').localeCompare(String(a.date||'')); }), sum = list.reduce(function(a,d){ return a+(+d.amount||0); },0);
  main.appendChild(el('div',{'class':'tot bad'},[ el('span',{text:periodLabel()+' · '+list.length+' '+L('कटौती','deductions')}), el('b',{text:'−'+rs(sum)}) ]));
  if (!list.length){ main.appendChild(el('div',{'class':'empty'},[ el('b',{text:'👍'}), L('इस समय में कोई कटौती नहीं।','No deductions in this period.') ])); return; }
  list.forEach(function(d){ main.appendChild(el('div',{'class':'job ded'},[ el('div',{'class':'top'},[ el('span',{text:dmy(d.date)}), el('b',{style:'color:var(--bad);font-size:20px',text:'−'+rs(d.amount)}) ]),
    el('div',{style:'margin-top:6px;font-weight:600',text:d.reason||''}), d.bookingId ? el('div',{'class':'small muted',text:L('ऑर्डर: ','Order: ')+d.bookingId}) : null ])); });
}
/* barcode scanner: Chrome on Android has BarcodeDetector built in */
function scan(){
  if (!('BarcodeDetector' in window) || !navigator.mediaDevices){ alert(L('इस फ़ोन में स्कैनर नहीं चलता — नंबर लिखकर “खोजें” दबाएँ।','Scanning is not supported on this phone — type the number and tap Find.')); return; }
  var ov = el('div',{style:'position:fixed;inset:0;background:#000;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center'});
  var v = el('video',{playsinline:'',muted:'',autoplay:'',style:'width:100%;max-height:75vh;object-fit:cover'});
  var hint = el('p',{style:'color:#fff;font-weight:700;text-align:center;padding:0 16px',text:L('बारकोड को कैमरे के बीच में रखें','Hold the barcode in the middle')});
  var stream = null, stop = false;
  function close(){ stop = true; if (stream) stream.getTracks().forEach(function(t){ t.stop(); }); ov.remove(); }
  ov.appendChild(v); ov.appendChild(hint); ov.appendChild(el('button',{'class':'btn',type:'button',text:'✕ '+L('बंद करें','Close'),onclick:close}));
  document.body.appendChild(ov);
  var fm = ['code_128','qr_code','code_39','code_93','ean_13','ean_8','upc_a','itf','codabar','data_matrix'];
  (BarcodeDetector.getSupportedFormats ? BarcodeDetector.getSupportedFormats() : Promise.resolve(fm)).then(function(sup){
    var det = new BarcodeDetector({formats: fm.filter(function(f){ return sup.indexOf(f) >= 0; })});
    return navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}}).then(function(st){ stream = st; v.srcObject = st; return v.play(); }).then(function(){
      (function loop(){ if (stop) return; det.detect(v).then(function(r){ if (r && r.length && !stop){ var code = r[0].rawValue; close(); lastCode = code; lookup(code); } else setTimeout(loop, 200); }, function(){ setTimeout(loop, 300); }); })();
    });
  }).catch(function(e){ close(); alert(L('कैमरा नहीं खुला — इजाज़त दें या नंबर लिखें।','Camera did not open — allow it or type the number.')); });
}
if (!tok){ screen('🔗', L('लिंक अधूरा है','Link is incomplete'), L('दुकान से भेजा गया पूरा लिंक खोलें।','Open the full link the shop sent you.')); return; }
db.collection('karigars').doc(tok).onSnapshot(function(s){
  if (!s.exists){ screen('🚫', L('यह लिंक बंद है','This link is closed'), L('दुकान मालिक से नया लिंक माँगें।','Ask the shop owner for a new link.')); return; }
  var first = !me; me = s.data();
  if (first){
    db.collection('karigars').doc(tok).collection('deductions').onSnapshot(function(q){ deds = []; q.forEach(function(d){ var x = d.data(); x._id = d.id; deds.push(x); }); draw(); }, function(){});
    db.collection('karigars').doc(tok).collection('work').onSnapshot(function(q){ work = []; q.forEach(function(d){ var x = d.data(); x._id = d.id; work.push(x); }); draw(); }, function(){});
  }
  draw();
}, function(){ screen('🚫', L('यह लिंक बंद है','This link is closed'), L('दुकान मालिक से नया लिंक माँगें।','Ask the shop owner for a new link.')); });
})();
