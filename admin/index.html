<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Diamond Fashions Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600&family=Hind:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#FBF8F2; --surface:#FFFFFF; --ink:#0B1626; --muted:#545B69; --line:#E4DCCB;
  --gold:#8C6C26; --gold-soft:#F3EAD6; --navy:#0B1626; --on-navy:#F2EEE6; --sign-gold:#CDAA5C;
  --ok:#1C7A3E; --bad:#A3262A; --warn:#9A5B00; --wa:#1C6E45; --blue:#1F4E8C;
  --f-brand:'Jost','Hind',system-ui,sans-serif; --f-body:'Hind','Jost',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0A1322; --surface:#12203A; --ink:#F2EEE6; --muted:#AEB5C2; --line:#25365A;
  --gold:#CDAA5C; --gold-soft:#1A2A46; --navy:#060D18; --ok:#4CC27A; --bad:#E0787B; --warn:#E3A44A; --wa:#34A56C; --blue:#7FB0F0; color-scheme:dark } }
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--sign-gold);outline-offset:2px}
[hidden]{display:none!important}
.wrap{max-width:1100px;margin:0 auto;padding:0 max(16px,env(safe-area-inset-left,0px)) 0 max(16px,env(safe-area-inset-right,0px))}
header{background:var(--navy);color:var(--on-navy);position:sticky;top:0;z-index:20;padding-top:env(safe-area-inset-top,0px)}
header .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px;flex-wrap:wrap}
.brand{font-family:var(--f-brand);font-weight:600;letter-spacing:.2em;font-size:17px}
.brand small{display:block;font-weight:400;letter-spacing:.3em;font-size:10px;color:var(--sign-gold)}
.hbtns{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 14px;border-radius:999px;border:1px solid rgba(205,170,92,.6);background:transparent;color:var(--on-navy);cursor:pointer;font-weight:600;font-size:14px;text-decoration:none}
nav.tabs{display:flex;gap:4px;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;border-bottom:2px solid var(--line);background:var(--surface);position:sticky;top:60px;z-index:15}
nav.tabs button{border:0;background:none;padding:12px 16px;font-weight:700;cursor:pointer;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-2px;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--sign-gold)}
nav.tabs .n{display:inline-block;min-width:20px;padding:0 6px;border-radius:999px;background:var(--bad);color:#fff;font-size:12px;margin-left:4px}
main{padding:18px 0 80px}
h1,h2,h3{margin:0;line-height:1.25}
h2{font-size:22px;margin-bottom:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 16px;border-radius:10px;border:1px solid transparent;font-weight:600;cursor:pointer;text-decoration:none;font-size:15px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.b-gold{background:var(--sign-gold);color:#0B1626}
.b-line{background:var(--surface);border-color:var(--line);color:var(--ink)}
.b-ok{background:var(--ok);color:#fff}
.b-bad{background:var(--surface);border-color:var(--bad);color:var(--bad)}
.b-wa{background:var(--wa);color:#fff}
.b-sm{min-height:36px;padding:0 12px;font-size:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:12px}
.card.new{border-left:5px solid var(--sign-gold)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.chip{min-height:38px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600;font-size:14px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.st{font-family:var(--f-brand);font-size:12px;font-weight:600;letter-spacing:.04em;padding:3px 10px;border-radius:999px;background:var(--gold-soft);color:var(--gold);white-space:nowrap}
.st.ok{color:var(--ok)}.st.bad{background:var(--bad);color:#fff}.st.new{background:var(--sign-gold);color:#0B1626}
.num{font-family:var(--f-brand);font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.muted{color:var(--muted)}
.small{font-size:14px}
.items{margin:8px 0;padding:0;list-style:none}
.items li{padding:4px 0;border-bottom:1px dashed var(--line)}
.items li:last-child{border-bottom:0}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 12px;font-size:15px;margin:6px 0}
.kv span:nth-child(odd){color:var(--muted)}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
.field label{font-weight:600;font-size:14px}
.field input,.field select,.field textarea{min-height:44px;border-radius:8px;border:1px solid var(--line);background:var(--bg);padding:8px 12px;width:100%}
.field textarea{min-height:70px}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.three{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:600px){.two,.three{grid-template-columns:minmax(0,1fr)}}
.msg{min-height:1.2em;font-weight:600;margin:6px 0}
.msg.ok{color:var(--ok)}.msg.err{color:var(--bad)}
.plist{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;cursor:pointer;text-align:left;padding:0}
.pcard:hover{border-color:var(--gold)}
.pcard .im{aspect-ratio:4/5;background:var(--gold-soft);display:flex;align-items:center;justify-content:center;color:var(--gold);font-weight:600}
.pcard .im img{width:100%;height:100%;object-fit:cover}
.pcard .b{padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.photos{display:flex;gap:8px;flex-wrap:wrap}
.ph{width:84px}
.ph img{width:84px;height:105px;object-fit:cover;border-radius:8px;border:2px solid var(--line);display:block}
.ph.cover img{border-color:var(--sign-gold)}
.ph .t{display:flex;justify-content:space-between;margin-top:3px}
.ph .t button{width:26px;height:28px;border:1px solid var(--line);background:var(--surface);border-radius:6px;cursor:pointer;padding:0;font-size:13px}
.addph{width:84px;height:105px;border:2px dashed var(--gold);border-radius:8px;display:flex;align-items:center;justify-content:center;text-align:center;color:var(--gold);font-weight:600;font-size:13px;position:relative;cursor:pointer}
.addph input{position:absolute;inset:0;opacity:0;cursor:pointer}
.scrim{position:fixed;inset:0;background:rgba(6,13,24,.62);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:var(--surface);border-radius:16px;width:min(720px,100%);max-height:100%;overflow:auto;padding:18px 18px 22px;position:relative}
.modal .x{position:absolute;top:10px;right:10px;width:42px;height:42px;border-radius:50%;border:0;background:var(--bg);cursor:pointer;font-size:20px}
@media (max-width:600px){.scrim{padding:0}.modal{border-radius:0;height:100%;max-height:none}}
table.inv{width:100%;border-collapse:collapse;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;font-size:15px}
table.inv th{text-align:left;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:8px 10px;border-bottom:1px solid var(--line);background:var(--bg)}
table.inv td{padding:6px 10px;border-bottom:1px solid var(--line)}
table.inv input{width:90px;min-height:38px;border:1px solid var(--line);border-radius:8px;padding:0 8px;background:var(--bg);text-align:right}
.invwrap{overflow-x:auto}
.login{max-width:420px;margin:60px auto;text-align:center}
.login .card{padding:24px}
.gbtn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:50px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:600;cursor:pointer;font-size:16px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:16px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.kpi b{display:block;font-family:var(--f-brand);font-size:24px}
.kpi span{font-size:13px;color:var(--muted)}
@media (max-width:600px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.search{width:100%;min-height:44px;border-radius:10px;border:1px solid var(--line);background:var(--surface);padding:0 12px;margin-bottom:12px}
</style>
</head>

/* stock: deduct once on accept, restore on reject/cancel/returned */
function stockChange(o, sign){
  var batch = db.batch(), touched = {};
  (o.items||[]).forEach(function(i){
    var p = byCode(i.sku||''); if (!p) return;
    var m = metresOf(i);
    var cur = touched[p.id] || {stockM:p.stockM, stock:Object.assign({}, p.stock||{})};
    if (p.unit==='m'){ var q2 = m || i.qty || 0; cur.stockM = Math.max(0, Math.round(((cur.stockM||0) + sign*q2)*100)/100); }
    else { var key = i.size || '_'; var v = cur.stock[key]; if (typeof v === 'number') cur.stock[key] = Math.max(0, v + sign*(i.qty||1)); }
    touched[p.id] = cur;
  });
  Object.keys(touched).forEach(function(id){ batch.set(db.collection('products').doc(id), touched[id], {merge:true}); });
  return Object.keys(touched).length ? batch.commit() : Promise.resolve();
}
function setStatus(o, s){
  var t = now(), upd = {status:s, log: FV.arrayUnion({at:t, s:s})};
  var pick = !/deliver|घर/i.test(o.how||'');
  var tr = {s:s, pick:pick}; tr['at.'+s] = t;
  var p = Promise.resolve();
  if (s==='accepted' && !o.inv){ upd.inv = true; p = stockChange(o, -1); }
  if ((s==='rejected'||s==='cancelled'||s==='returned') && o.inv){ upd.inv = false; p = stockChange(o, +1); }
  if (s==='delivered') upd.deliveredAt = t;
  p.then(function(){
    return db.collection('orders').doc(o.id).update(upd);
  }).then(function(){
    return db.collection('track').doc(o.id).set({s:s, pick:pick, at:Object.assign({}, (track[o.id]&&track[o.id].at)||{}, (function(){ var a={}; a[s]=t; return a; })())}, {merge:true});
  }).then(function(){
    if (['accepted','packed','shipped','pickup','delivered','cancelled','rejected','return_ok','return_no','returned'].indexOf(s)>=0 && o.phone){
      if (confirm((ST[s]||s)+L(' ✓\nग्राहक को WhatsApp पर बताएँ?'))) window.open(waTo(o.phone, custMsg(Object.assign({},o,{status:s}), s)), '_blank');
    }
  }).catch(function(e){ alert(L('सेव नहीं हुआ: ')+(e.message||e)); });
}

function compress(src, maxW, q){

    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); res(c.toDataURL('image/jpeg', q)); }; img.onerror = rej; img.src = src; });
}

/* watch product changes: new item with photo, or stock at or below the limit */
function socialWatch(){
  if (!meta || !meta.pageToken || !metaLoaded) return;
  var lim = meta.low || 3;
  var base = db.batch(), nb = 0;
  products.forEach(function(p){
    if (p.hidden || socialBusy[p.id]) return;
    var s0 = p.social || {}, l0 = pcsLeft(p);
    if (meta.autoNew === false && !s0.newAt && (p.photos||[]).length){ base.update(db.collection('products').doc(p.id), {'social.newAt':'skipped'}); nb++; return; }
    if (meta.autoLow === false && !s0.lowAt && l0 !== null && l0 > 0 && l0 <= lim){ base.update(db.collection('products').doc(p.id), {'social.lowAt':'skipped'}); nb++; return; }
    var sc = p.social || {}, left = pcsLeft(p), job = null, mark = {};
    if (meta.autoNew !== false && !sc.newAt && (p.photos||[]).length && p.inStock !== false){ job = 'new'; mark['social.newAt'] = now(); }
    else if (meta.autoLow !== false && left !== null && left > 0 && left <= lim && !sc.lowAt){ job = 'low'; mark['social.lowAt'] = now(); }
    else if (sc.lowAt && left !== null && left > lim){ db.collection('products').doc(p.id).update({'social.lowAt': FV.delete()}).catch(function(){}); }
    if (!job) return;
    socialBusy[p.id] = true;
    socialQueue = socialQueue.then(function(){
      return db.collection('products').doc(p.id).update(mark).then(function(){ return (job === 'new' && meta.video !== false && (p.photos||[]).length >= 3 && vidType()) ? makeVideo(p, job).then(function(vd){ return postVideo(p, job, vd); }) : postProduct(p, job); })

  });
  if (nb) base.commit().catch(function(){});
}

/* ---------- product video (Reel) from photos ---------- */
var VID_TYPES = ['video/mp4;codecs=avc1.42E01E','video/mp4;codecs=avc1.4D401F','video/mp4;codecs=avc1','video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm'];
function vidType(){ if (!window.MediaRecorder) return ''; for (var i = 0; i < VID_TYPES.length; i++) if (MediaRecorder.isTypeSupported(VID_TYPES[i])) return VID_TYPES[i]; return ''; }
function canReel(t){ return /avc1/.test(t || vidType()); } // Instagram needs H.264 MP4
/* 720x1280 vertical slideshow: intro, each photo with slow zoom + crossfade, end card. Plays in real time while it records. */
function makeVideo(p, kind, onProgress){
  var type = vidType();
  if (!type) return Promise.reject(new Error(SL('यह ब्राउज़र वीडियो नहीं बना सकता। Chrome में Admin खोलें।','This browser cannot make videos. Open Admin in Chrome.')));
  return Promise.all((p.photos||[]).slice(0, 10).map(loadImg)).then(function(imgs){
    imgs = imgs.filter(Boolean);
    if (!imgs.length) throw new Error(SL('फ़ोटो नहीं है','No photos'));
    var W = 720, H = 1280, c = document.createElement('canvas'); c.width = W; c.height = H; var x = c.getContext('2d');
    var INTRO = 1.6, PER = 2.3, FADE = .5, END = 3.2, total = INTRO + imgs.length * PER + END;
    var left = pcsLeft(p);
    var price = p.price ? '₹' + Number(p.price).toLocaleString('en-IN') + (p.unit === 'm' ? ' / m' : '') : 'Ask for price';
    var tag = kind === 'low' ? ('ONLY ' + left + ' LEFT · सिर्फ़ ' + left + ' बचे') : 'NEW ARRIVAL · नया माल';
    function cover(im, zoom, alpha){
      x.globalAlpha = alpha;
      var k = Math.max(W/im.width, H/im.height) * 1.1, w = im.width*k, h = im.height*k;
      x.filter = 'blur(28px) brightness(.55)'; x.drawImage(im, (W-w)/2, (H-h)/2, w, h); x.filter = 'none';
      var f = Math.min(W/im.width, (H-150)/im.height) * zoom, fw = im.width*f, fh = im.height*f;
      x.drawImage(im, (W-fw)/2, Math.max(0, (H-330-fh)/2 + 40), fw, fh);
      x.globalAlpha = 1;
    }
    function band(a){
      x.globalAlpha = a; var g = x.createLinearGradient(0, H-330, 0, H); g.addColorStop(0,'rgba(11,22,38,0)'); g.addColorStop(.35,'rgba(11,22,38,.85)'); g.addColorStop(1,'rgba(11,22,38,.97)'); x.fillStyle = g; x.fillRect(0, H-330, W, 330);
      x.fillStyle = kind === 'low' ? '#C0392B' : '#CDAA5C'; x.font = 'bold 26px Arial, sans-serif'; var tw = x.measureText(tag).width + 36;
      x.beginPath(); if (x.roundRect) x.roundRect(36, H-250, tw, 46, 23); else x.rect(36, H-250, tw, 46); x.fill();
      x.fillStyle = kind === 'low' ? '#fff' : '#0B1626'; x.fillText(tag, 54, H-218);
      x.fillStyle = '#fff'; x.font = 'bold 40px Arial, sans-serif'; wrapText(x, p.name, 36, H-150, W-72, 46, 1);
      x.fillStyle = '#CDAA5C'; x.font = 'bold 44px Arial, sans-serif'; x.fillText(price, 36, H-90);
      if (p.mrp && p.price && p.mrp > p.price){ var pw = x.measureText(price).width; x.font = '28px Arial, sans-serif'; x.fillStyle = '#9AA3B2'; var mt = '₹' + Number(p.mrp).toLocaleString('en-IN'); x.fillText(mt, 56+pw, H-90); x.fillRect(56+pw, H-100, x.measureText(mt).width, 3);
        x.fillStyle = '#4CC27A'; x.font = 'bold 28px Arial, sans-serif'; x.fillText(Math.round((1-p.price/p.mrp)*100)+'% OFF', 76+pw+x.measureText(mt).width, H-90); }
      x.fillStyle = '#D3CEC2'; x.font = '22px Arial, sans-serif'; x.fillText('diamondfashions.in · WhatsApp ' + (cfg.display || '+91 88741 29818'), 36, H-40);
      x.globalAlpha = 1;
    }
    function brand(y, size){ x.textAlign = 'center'; x.fillStyle = '#F2EEE6'; x.font = '600 ' + size + 'px Georgia, serif'; x.fillText('DIAMOND', W/2, y); x.fillStyle = '#CDAA5C'; x.font = (size*.42|0) + 'px Arial, sans-serif'; x.fillText('F A S H I O N S', W/2, y + size*.62); x.textAlign = 'left'; }
    function frame(t){
      x.fillStyle = '#0B1626'; x.fillRect(0, 0, W, H);
      if (t < INTRO){ // intro card
        var a = Math.min(1, t/.4); x.globalAlpha = a; brand(H/2 - 60, 84);
        x.textAlign = 'center'; x.fillStyle = kind === 'low' ? '#E0787B' : '#CDAA5C'; x.font = 'bold 34px Arial, sans-serif'; x.fillText(kind === 'low' ? 'HURRY! LIMITED STOCK' : 'NEW ARRIVAL', W/2, H/2 + 80);
        x.fillStyle = '#D3CEC2'; x.font = '28px Arial, sans-serif'; x.fillText(kind === 'low' ? 'जल्दी करें, कुछ ही पीस बचे' : 'नया माल आ गया है', W/2, H/2 + 128); x.textAlign = 'left'; x.globalAlpha = 1;
        // fade into first photo
        if (t > INTRO - FADE) cover(imgs[0], 1, (t - (INTRO - FADE)) / FADE);
        return;
      }
      var tp = t - INTRO, i = Math.floor(tp / PER);
      if (i < imgs.length){
        var lt = tp - i*PER, z = 1 + .08 * (lt / PER);
        cover(imgs[i], z, 1);
        if (lt > PER - FADE){ var nx = imgs[i+1]; var fa = (lt - (PER - FADE)) / FADE;
          if (nx) cover(nx, 1, fa); else { x.globalAlpha = fa; x.fillStyle = '#0B1626'; x.fillRect(0,0,W,H); x.globalAlpha = 1; } }
        band(Math.min(1, tp/.5));
        // photo counter dots
        for (var d = 0; d < imgs.length; d++){ x.fillStyle = d === i ? '#CDAA5C' : 'rgba(255,255,255,.5)'; x.beginPath(); x.arc(W/2 - (imgs.length-1)*9 + d*18, 40, d === i ? 6 : 4, 0, 7); x.fill(); }
        return;
      }
      // end card
      var et = tp - imgs.length*PER, ea = Math.min(1, et/.4); x.globalAlpha = ea;
      var thumb = imgs[0], tw = 360, th = 450, k = Math.max(tw/thumb.width, th/thumb.height);
      x.save(); x.beginPath(); if (x.roundRect) x.roundRect((W-tw)/2, 150, tw, th, 20); else x.rect((W-tw)/2, 150, tw, th); x.clip();
      x.drawImage(thumb, (W - thumb.width*k)/2, 150 + (th - thumb.height*k)/2, thumb.width*k, thumb.height*k); x.restore();
      x.strokeStyle = '#CDAA5C'; x.lineWidth = 4; x.strokeRect((W-tw)/2 - 2, 148, tw + 4, th + 4);
      x.textAlign = 'center'; x.fillStyle = '#fff'; x.font = 'bold 44px Arial, sans-serif'; x.fillText(p.name.length > 26 ? p.name.slice(0,25)+'…' : p.name, W/2, 680);
      x.fillStyle = '#CDAA5C'; x.font = 'bold 60px Arial, sans-serif'; x.fillText(price, W/2, 760);
      if (p.mrp && p.price && p.mrp > p.price){ x.fillStyle = '#4CC27A'; x.font = 'bold 32px Arial, sans-serif'; x.fillText('MRP ₹' + Number(p.mrp).toLocaleString('en-IN') + ' · ' + Math.round((1-p.price/p.mrp)*100) + '% OFF', W/2, 812); }
      x.fillStyle = '#D3CEC2'; x.font = '28px Arial, sans-serif'; x.fillText('Code: ' + p.code + (p.sizes ? '  ·  Sizes: ' + p.sizes : ''), W/2, 866);
      x.fillStyle = '#CDAA5C'; x.beginPath(); if (x.roundRect) x.roundRect(110, 920, W-220, 76, 38); else x.rect(110, 920, W-220, 76); x.fill();
      x.fillStyle = '#0B1626'; x.font = 'bold 32px Arial, sans-serif'; x.fillText('Order: diamondfashions.in', W/2, 970);
      x.fillStyle = '#F2EEE6'; x.font = '30px Arial, sans-serif'; x.fillText('WhatsApp ' + (cfg.display || '+91 88741 29818'), W/2, 1050);
      x.textAlign = 'left'; brand(1160, 52); x.globalAlpha = 1;
    }
    return new Promise(function(resolve, reject){
      var stream = c.captureStream(30), chunks = [], rec;
      try { rec = new MediaRecorder(stream, {mimeType:type, videoBitsPerSecond:3500000}); } catch(e){ reject(e); return; }
      rec.ondataavailable = function(e){ if (e.data && e.data.size) chunks.push(e.data); };
      rec.onstop = function(){ resolve({blob:new Blob(chunks, {type:type.split(';')[0]}), type:type, seconds:total}); };
      frame(0); rec.start(500);
      var t0 = performance.now(), timer = setInterval(function(){
        var t = (performance.now() - t0) / 1000;
        if (t >= total){ clearInterval(timer); frame(total - .01); setTimeout(function(){ rec.stop(); }, 150); return; }
        frame(t); if (onProgress) onProgress(Math.min(99, Math.round(t / total * 100)));
      }, 1000/30);
    });
  });
}
function wait(ms){ return new Promise(function(r){ setTimeout(r, ms); }); }
/* upload the video to the Facebook Page, then reuse it as an Instagram Reel */
function postVideo(p, kind, vid){
  if (!meta || !meta.pageToken) return Promise.reject(new Error(SL('पहले Facebook जोड़ें (सेटिंग में)', 'Connect Facebook first (in Settings)')));
  var tok = meta.pageToken, cap = postCaption(p, kind, pcsLeft(p)), out = {fb:'', ig:''};
  var fd = new FormData(); fd.append('source', vid.blob, /mp4/.test(vid.type) ? 'reel.mp4' : 'reel.webm');
  fd.append('description', cap); fd.append('published', meta.fb === false ? 'false' : 'true'); fd.append('access_token', tok);
  return gfetch(meta.pageId + '/videos', {}, 'POST', fd).then(function(r){
    out.fb = meta.fb === false ? '' : r.id;
    if (!meta.igId || meta.ig === false) return;
    if (!canReel(vid.type)) throw new Error(SL('Facebook पर वीडियो गया। Instagram के लिए MP4 चाहिए, फ़ोन के Chrome में Admin खोलें।','Video posted on Facebook. Instagram needs MP4: open Admin in Chrome on your phone.'));
    var tries = 0;
    function src(){ return gfetch(r.id, {fields:'source,status', access_token:tok}).then(function(v){
      if (v.source) return v.source; if (++tries > 40) throw new Error('Facebook is still processing the video'); return wait(4000).then(src); }); }
    return src().then(function(url){ return gfetch(meta.igId + '/media', {media_type:'REELS', video_url:url, caption:igCaption(cap, p), share_to_feed:'true', access_token:tok}, 'POST'); })
      .then(function(cr){ var n = 0;
        function ready(){ return gfetch(cr.id, {fields:'status_code', access_token:tok}).then(function(st){
          if (st.status_code === 'FINISHED') return; if (st.status_code === 'ERROR' || ++n > 45) throw new Error('Instagram could not process the video');
          return wait(4000).then(ready); }); }
        return ready().then(function(){ return gfetch(meta.igId + '/media_publish', {creation_id:cr.id, access_token:tok}, 'POST'); }); })
      .then(function(pub){ out.ig = pub.id; });
  }).then(function(){ socialLog({at:now(), code:p.code, name:p.name, kind:kind, video:true, fb:out.fb, ig:out.ig, ok:true}); return out; },
     function(e){ socialLog({at:now(), code:p.code, name:p.name, kind:kind, video:true, fb:out.fb, ok:false, err:String(e.message||e).slice(0,200)}); throw e; });
}
/* preview window: make, watch, download, post */
function videoDialog(p){
  var sc = el('div',{'class':'scrim'}), box = el('div',{'class':'modal',style:'max-width:460px'}); sc.appendChild(box); document.body.appendChild(sc);
  var msg = el('p',{'class':'msg',text:SL('वीडियो बन रहा है… यह स्क्रीन खुली रखें','Making the video… keep this screen open')});
  var close = function(){ sc.remove(); };
  box.appendChild(el('div',{'class':'row',style:'justify-content:space-between'},[ el('h3',{style:'margin:0',text:'🎬 '+p.name}), el('button',{'class':'btn b-line b-sm',type:'button',text:'×',onclick:close}) ]));
  box.appendChild(msg);
  var lft = pcsLeft(p), kind = lft !== null && lft > 0 && lft <= ((meta && meta.low) || 3) ? 'low' : 'new';
  makeVideo(p, kind, function(pc){ msg.textContent = SL('वीडियो बन रहा है… ','Making the video… ') + pc + '%'; }).then(function(vid){
    var url = URL.createObjectURL(vid.blob);
    msg.textContent = SL('वीडियो तैयार ✓','Video ready ✓') + ' (' + Math.round(vid.blob.size/1024/1024*10)/10 + ' MB)'; msg.className = 'msg ok';
    box.appendChild(el('video',{src:url,controls:'',autoplay:'',muted:'',playsinline:'',style:'width:100%;max-height:60vh;border-radius:10px;background:#000;margin:8px 0'}));
    var acts = el('div',{'class':'row'});
    acts.appendChild(el('a',{'class':'btn b-line',href:url,download:p.code + (/mp4/.test(vid.type) ? '.mp4' : '.webm'),text:SL('⬇ डाउनलोड (WhatsApp स्टेटस के लिए)','⬇ Download (for WhatsApp status)')}));
    if (meta && meta.pageToken){ var pb = el('button',{'class':'btn b-gold',type:'button',text:'📣 '+SL('FB/Instagram पर पोस्ट','Post to FB / Instagram'),onclick:function(){
      pb.disabled = true; msg.textContent = SL('अपलोड हो रहा है… 1–3 मिनट','Uploading… 1–3 minutes'); msg.className = 'msg';
      postVideo(p, kind, vid).then(function(){ msg.textContent = SL('पोस्ट हो गया ✓','Posted ✓'); msg.className = 'msg ok'; }, function(e){ msg.textContent = (e.message||e); msg.className = 'msg err'; pb.disabled = false; }); }}); acts.appendChild(pb); }
    box.appendChild(acts);
  }, function(e){ msg.textContent = e.message || e; msg.className = 'msg err'; });
}

/* ---------- live data ---------- */
var drawTimer = null;
function redraw(){ clearTimeout(drawTimer); drawTimer = setTimeout(function(){ if (!document.querySelector('.scrim')) draw(); }, 120); }
function listen(){
  unsubs.forEach(function(u){ u(); }); unsubs = [];
  unsubs.push(db.collection('orders').orderBy('created','desc').limit(400).onSnapshot(function(s){
    var before = newCount(); orders = s.docs.map(function(d){ return d.data(); });
    if (newCount() > before && before >= 0 && orders.length) { try { new Audio('data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQAAAAA=').play(); } catch(e){} document.title = '('+newCount()+') Diamond Fashions Admin'; }
    redraw(); }, function(e){ app.innerHTML=''; drawLogin(L('डेटा नहीं खुला: ')+e.message+L(' (Firestore Rules चेक करें)')); }));
  unsubs.push(db.collection('requests').orderBy('created','desc').limit(300).onSnapshot(function(s){ requests = s.docs.map(function(d){ var x = d.data(); x._id = d.id; return x; }); redraw(); }));
  unsubs.push(db.collection('products').onSnapshot(function(s){ products = s.docs.map(function(d){ return d.data(); }).sort(function(a,b){ return (a.order||0)-(b.order||0); }); redraw(); socialWatch(); }));
  unsubs.push(metaRef().onSnapshot(function(s){ meta = s.exists ? s.data() : null; metaLoaded = true; if (tab === 'settings') redraw(); socialWatch(); }, function(){ metaLoaded = false; }));
  unsubs.push(db.collection('track').onSnapshot(function(s){ track = {}; s.docs.forEach(function(d){ track[d.id] = d.data(); }); }));
  unsubs.push(db.collection('config').doc('shop').onSnapshot(function(s){ cfg = s.exists ? s.data() : {}; }));
  unsubs.push(db.collection('reviews').orderBy('created','desc').limit(500).onSnapshot(function(s){ reviews = s.docs.map(function(d){ var x = d.data(); x._id = d.id; return x; }); if (tab === 'reviews') redraw(); }, function(){}));
  unsubs.push(db.collection('config').onSnapshot(function(s){ banners = s.docs.filter(function(d){ return d.id.indexOf('banner_') === 0; }).map(function(d){ var x = d.data(); x._id = d.id; return x; }).sort(function(a,b){ return (a.order||0)-(b.order||0); }); if (tab === 'banners') redraw(); }));
}
auth.getRedirectResult().catch(function(){});
auth.onAuthStateChanged(function(u){
  me = u;
  if (!u){ unsubs.forEach(function(x){ x(); }); unsubs = []; drawLogin(); return; }
  if (!isAdmin(u)){ drawLogin(L('यह खाता (')+u.email+L(') मालिक का नहीं है। सही Gmail से लॉग-इन करें।')); auth.signOut(); return; }
  draw(); listen();
});
})();
